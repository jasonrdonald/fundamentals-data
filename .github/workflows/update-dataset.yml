name: Daily prices

# Appends the latest sessions to the stored prices (incremental). Can also be run by hand in any
# mode; the weekly and monthly jobs have their own workflows.
on:
  schedule:
    # 17:00 UTC = 22:30 IST, after NSE's 15:30 close and Yahoo's end-of-day update, Monday-Friday.
    - cron: 0 17 * * 1-5
  workflow_dispatch:
    inputs:
      mode:
        description: "daily = recent prices; weekly = constituents + fundamentals; full = re-download everything"
        type: choice
        options: [daily, weekly, full]
        default: daily

permissions:
  contents: write

# Shared by all dataset workflows, so two runs never write the dataset at once.
concurrency:
  group: update-dataset
  cancel-in-progress: false

jobs:
  update:
    uses: ./.github/workflows/dataset-job.yml
    with:
      mode: ${{ inputs.mode || 'daily' }}
