name: Update dataset

on:
  schedule:
    # 11:30 UTC = 17:00 IST, after NSE's 15:30 close, Monday-Friday.
    - cron: "30 11 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-dataset
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Build dataset from public index data
        run: python tools/build_dataset.py

      - name: Commit and push if the data changed
        run: |
          if git diff --quiet -- shared-data/dataset.json; then
            echo "No data changes."
            exit 0
          fi
          summary=$(python -c "import json; d=json.load(open('shared-data/dataset.json')); print(f\"v{d['version']} through {d['updatedAt']}\")")
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add shared-data/dataset.json
          git commit -m "Update dataset $summary"
          git push
