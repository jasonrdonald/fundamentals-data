name: Update dataset

on:
  schedule:
    # 11:30 UTC = 17:00 IST, after NSE's 15:30 close, Monday-Friday.
    - cron: 0 17 * * 1-5
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-dataset
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Build dataset from public index data
        run: python tools/build_dataset.py

      # Splits the dataset into the parts apps load progressively (analytics, core, history),
      # precomputes the analysis tables, and records the run in the manifest's timeline.
      - name: Derive progressive parts and precomputed analytics
        run: python tools/derive_parts.py

      - name: Commit and push if the data changed
        run: |
          if git diff --quiet -- shared-data/ && [ -z "$(git ls-files --others --exclude-standard shared-data/)" ]; then
            echo "No data changes."
            exit 0
          fi
          summary=$(python -c "import json; m=json.load(open('shared-data/v4/manifest.json')); print(f\"v{m['version']} (dataset v{m['datasetVersion']}) through {m['asOf']}; changed: {', '.join(m['history'][0]['changed'])}\")")
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add shared-data/
          git commit -m "Update dataset $summary"
          git push
