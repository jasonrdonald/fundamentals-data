name: Add to wishlist

# Approves stock requests sent from the app: checks each ticker on Yahoo Finance again, adds the
# valid ones to tools/wishlist.csv, then starts a daily dataset run so they're backfilled and
# published straight away.
on:
  workflow_dispatch:
    inputs:
      tickers:
        description: "Tickers from the request email, e.g. IRCON, TECHD=TECHD-SM.NS"
        required: true
        type: string

permissions:
  contents: write
  actions: write

# Shares the dataset workflows' queue, so the wishlist never changes under a running build.
concurrency:
  group: update-dataset
  cancel-in-progress: false

jobs:
  add:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Check and add tickers
        env:
          TICKERS: ${{ inputs.tickers }}
          ADDED_FILE: ${{ runner.temp }}/added.txt
        run: python tools/add_to_wishlist.py "$TICKERS"

      - name: Commit and push
        env:
          ADDED_FILE: ${{ runner.temp }}/added.txt
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/wishlist.csv
          git commit -m "Add to wishlist: $(cat "$ADDED_FILE")"
          git push

      - name: Publish the new stocks
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run update-dataset.yml --ref "${{ github.ref_name }}" -f mode=daily
