org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
org.gradle.caching=true
org.gradle.configuration-cache=true
android.useAndroidX=true
android.nonTransitiveRClass=true

# URL of the shared dataset JSON that every install reads (no auth).
# Leave blank to run purely on the bundled seed dataset.
# Example: dataset.url=https://raw.githubusercontent.com/<org>/<repo>/main/dataset.json
dataset.url=https://raw.githubusercontent.com/jasonrdonald/fundamentals-data/main/shared-data/dataset.json
