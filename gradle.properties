org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
org.gradle.caching=true
org.gradle.configuration-cache=true
android.useAndroidX=true
android.nonTransitiveRClass=true

# Manifest of the shared dataset that every install reads (no auth). The app downloads it first,
# then only the parts (analytics, core, history) whose version changed.
# Leave blank to run purely on the bundled seed data.
dataset.manifestUrl=https://raw.githubusercontent.com/jasonrdonald/fundamentals-data/main/shared-data/v5/manifest.json
# Where the dataset pipeline runs (opened from the app's Data page).
dataset.pipelineUrl=https://github.com/jasonrdonald/fundamentals-data/actions/workflows/update-dataset.yml
# Workflow that approves stock requests sent from the app (linked in the request email).
wishlist.workflowUrl=https://github.com/jasonrdonald/fundamentals-data/actions/workflows/add-to-wishlist.yml
